<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfaf3"/>
      <stop offset="0.55" stop-color="#f4ecdd"/>
      <stop offset="1" stop-color="#e4d7be"/>
    </linearGradient>
    <linearGradient id="runner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#efe6d2"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.36" r="0.6">
      <stop offset="0" stop-color="#fffdf5" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fffdf5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="1200" fill="url(#sky)"/>

  <!-- distant tree line -->
  <g fill="#8a9578" opacity="0.38">
    <path d="M40 1200 C60 900 76 820 92 780 C108 820 124 900 144 1200 Z"/>
    <path d="M132 1200 C150 960 164 896 178 862 C192 896 206 960 224 1200 Z"/>
    <path d="M656 1200 C676 900 692 820 708 780 C724 820 740 900 760 1200 Z"/>
    <path d="M576 1200 C594 960 608 896 622 862 C636 896 650 960 668 1200 Z"/>
  </g>

  <!-- aisle -->
  <path d="M296 1200 L356 700 L444 700 L504 1200 Z" fill="url(#runner)"/>
  <path d="M320 1200 L372 720 L428 720 L480 1200 Z" fill="#fffdf8" opacity="0.7"/>

  <!-- chairs along the aisle -->
  <g fill="none" stroke="#c9b493" stroke-width="3" opacity="0.65">
    <path d="M250 900 v70 M230 930 h40 M262 870 v60"/>
    <path d="M206 990 v80 M182 1024 h48 M220 954 v70"/>
    <path d="M550 900 v70 M530 930 h40 M538 870 v60"/>
    <path d="M594 990 v80 M570 1024 h48 M580 954 v70"/>
  </g>

  <!-- floral clusters -->
  <g fill="#fffdf8" stroke="#e2d8c0" stroke-width="2">
    <circle cx="238" cy="838" r="26"/><circle cx="206" cy="874" r="20"/><circle cx="270" cy="878" r="22"/>
    <circle cx="562" cy="838" r="26"/><circle cx="594" cy="874" r="20"/><circle cx="530" cy="878" r="22"/>
    <circle cx="400" cy="676" r="22"/><circle cx="362" cy="706" r="16"/><circle cx="438" cy="706" r="16"/>
  </g>
  <g fill="#7e8c6c" opacity="0.5">
    <path d="M206 852 q-30 -14 -40 -44 q34 4 44 38z"/>
    <path d="M594 852 q30 -14 40 -44 q-34 4 -44 38z"/>
  </g>

  <!-- candle stands -->
  <g fill="#e3d6b8">
    <rect x="352" y="700" width="10" height="120" rx="5"/>
    <rect x="438" y="700" width="10" height="120" rx="5"/>
  </g>

  <rect width="800" height="1200" fill="url(#halo)"/>
</svg>
